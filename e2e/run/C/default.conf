# log leggibile per il debug del proxy: mostra a quale upstream è andata la richiesta e con che esito
# (l'header Authorization NON viene loggato)
log_format mapp '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time';

# header Authorization verso GeoServer per metodo HTTP (generato all'avvio da 35-proxy-config.sh)
include /tmp/claude-0/-home-claude/7cc3e260-b8c6-5054-96fd-442188c76508/scratchpad/ep/e2e/run/C/proxy.d/*.map;

server {
  listen 8096;
  server_name _;

  access_log /tmp/claude-0/-home-claude/7cc3e260-b8c6-5054-96fd-442188c76508/scratchpad/ep/e2e/run/C/access.log mapp;
  error_log /tmp/claude-0/-home-claude/7cc3e260-b8c6-5054-96fd-442188c76508/scratchpad/ep/e2e/run/C/server-error.log warn;
  root /tmp/claude-0/-home-claude/7cc3e260-b8c6-5054-96fd-442188c76508/scratchpad/ep/e2e/run/C/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # configurazione runtime: mai in cache
  location = /config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # asset con hash nel nome: cache lunga
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # worker di MapLibre (.mjs): alcune versioni di mime.types non lo conoscono e il browser rifiuta i moduli senza MIME JavaScript
  location ~ ^/assets/.+\.mjs$ {
    default_type text/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # reverse proxy verso backend e GeoServer (generato all'avvio da 35-proxy-config.sh)
  include /tmp/claude-0/-home-claude/7cc3e260-b8c6-5054-96fd-442188c76508/scratchpad/ep/e2e/run/C/proxy.d/*.conf;

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
