location /api/ {
  default_type application/json;
  return 503 '{"error":"BACKEND_URL non configurata"}';
}
location /geoserver/ {
  limit_except GET { deny all; }
  proxy_pass http://127.0.0.1:8600/geoserver/;
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:8600;

  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_read_timeout 120s;
  proxy_set_header Authorization $gs_auth;
}
location /geocode/ {
  limit_except GET { deny all; }
  limit_req zone=geocode_rl burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:8600/nominatim/;
  proxy_http_version 1.1;
  proxy_set_header Host 127.0.0.1:8600;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_set_header Referer "";
  proxy_set_header User-Agent "mapp-web-test";
  proxy_hide_header Set-Cookie;
  proxy_ignore_headers Cache-Control Expires Set-Cookie;
  proxy_cache geocode_cache;
  proxy_cache_key "$request_uri";
  proxy_cache_valid 200 1d;
  proxy_read_timeout 15s;
}
