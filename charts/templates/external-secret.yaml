apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.eso.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.eso.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range $key := .Values.eso.secrets }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: {{ $key }}
    {{- end }}