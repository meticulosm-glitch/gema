apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.eso.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.eso.existingSecret }}
    creationPolicy: Owner
  data:
    {{- /* ogni voce: "NOME" (stessa proprietà in Vault) oppure {key: NOME, property: proprietà in Vault} */}}
    {{- range $s := .Values.eso.secrets }}
    {{- $key := $s }}{{ $prop := $s }}
    {{- if kindIs "map" $s }}{{ $key = $s.key }}{{ $prop = default $s.key $s.property }}{{ end }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: {{ $prop }}
    {{- end }}