# Inizializza la configurazione di mapp-web (ruoli, dashboard e viste salvate) a ogni sync di ArgoCD, in modo idempotente:
#   1) initContainer "init-db": con l'utenza di amministrazione crea (se serve) database, tabelle e utente applicativo in PostgreSQL
#   2) container "publish-geoserver": crea workspace, datastore e i layer role_rules / dashboards / saved_views / catalog_folders / catalog_layers / role_views / edit_forms / announcements / dashboard_drafts / change_log / usage_events (+ viste usage_*) in GeoServer
# Al primo avvio fa tutto; dai sync successivi riconosce che c'è già tutto e termina subito.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gema.configInitName" . }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-init
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation   # il Job precedente viene rimosso prima di crearne uno nuovo
    argocd.argoproj.io/sync-wave: "1"                           # dopo la ConfigMap
spec:
  backoffLimit: 6                 # GeoServer o PostgreSQL potrebbero non essere ancora pronti
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "gema.configInitLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-db
          image: docker.io/library/postgres:17-alpine
          command:
            - /scripts/init-db.sh
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: {{ .Values.postgres.host }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: port
                  optional: true
            # utenza di AMMINISTRAZIONE: serve solo a questo passo (CREATE DATABASE, tabelle, ruolo applicativo)
            - name: PG_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: PG_ADMIN_USER
            - name: PG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: PG_ADMIN_PASSWORD
            # utenza APPLICATIVA (datastore GeoServer): viene creata se manca e riceve solo i diritti sulle tabelle
            - name: GS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: gs_user
                  optional: true
            - name: GS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: gs_password
                  optional: true
            - name: MAPP_DB
              value: gema_config
            - name: MAPP_SCHEMA
              value: gema_config
            - name: DB_CREATE
              value: "true"        # "false" se il database esiste già (l'admin deve poter fare CREATE DATABASE)
            - name: POSTGIS_EXTENSION
              value: "true"        # CREATE EXTENSION postgis nel database (best effort)
            - name: CHANGE_LOG_DAYS
              value: {{ .Values.changeLogDays | default 0 | quote }}   # giorni di registro modifiche da conservare (0 = per sempre)
            - name: USAGE_DAYS
              value: {{ .Values.usageDays | default 180 | quote }}   # giorni di eventi d'uso da conservare (0 = per sempre)
          securityContext:
            runAsUser: 70                    # utente "postgres" dell'immagine alpine
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: publish-geoserver
          image: docker.io/curlimages/curl:8.11.1
          command:
            - /scripts/publish-geoserver.sh
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: PUBLISH_GEOSERVER
              value: "true"
            - name: UPDATE_DATASTORE
              value: "true"                    # allinea un datastore già esistente (db, schema, utente, password)
            - name: GEOSERVER_URL                # URL interno per la REST API di GeoServer
              value: {{ required "configJob.geoserverUrl è obbligatorio" .Values.configJob.geoserverUrl | quote }}
            - name: GEOSERVER_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configGeoserverSecret" . }}
                  key: user
            - name: GEOSERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configGeoserverSecret" . }}
                  key: password
            - name: CONFIG_WORKSPACE
              value: {{ include "gema.configWorkspace" . | quote }}
            - name: DATASTORE
              value: gema_config
            - name: MAPP_DB
              value: gema_config
            - name: MAPP_SCHEMA
              value: gema_config
            # connessione che GeoServer userà per leggere le tabelle: SOLO l'utenza applicativa
            - name: PGHOST
              value: {{ .Values.postgres.host }}
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: port
                  optional: true
            - name: GS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: gs_user
                  optional: true
            - name: GS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: gs_password
                  optional: true
            # fallback (se GS_DB_* non sono presenti nel secret)
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: user
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gema.configDbSecret" . }}
                  key: password
                  optional: true
            # regole dati di GeoServer
            - name: SET_ACL
              value: "true"
            # ruoli GeoServer (dal plugin OIDC: ROLE_ + ruolo Keycloak in maiuscolo); di default quelli di ADMIN_ROLE,
            # VIEWER_ROLE e KNOWN_ROLES dell'app, oppure configJob.aclReadRoles / aclWriteRoles / aclViewsWriteRoles
            - name: ACL_READ_ROLES
              value: {{ include "gema.aclReadRoles" . | quote }}
            - name: ACL_WRITE_ROLES
              value: {{ include "gema.aclWriteRoles" . | quote }}   # scrittura su role_rules, dashboards, catalogo, role_views, edit_forms, announcements e dashboard_drafts (che solo loro leggono)
            {{- with .Values.configJob.aclViewsWriteRoles }}
            - name: ACL_VIEWS_WRITE_ROLES
              value: {{ . | quote }}               # scrittura su saved_views (default = ACL_READ_ROLES)
            {{- end }}
          securityContext:
            runAsUser: 100                   # curl_user
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ include "gema.configInitName" . }}
            defaultMode: 0555
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi