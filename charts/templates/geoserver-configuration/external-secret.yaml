apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mapp-config-db
  namespace: {{ .Release.Namespace }}
  annotations: 
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mapp-config-db
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: gema_db_user
    - secretKey: password
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: gema_db_password
    - secretKey: gs_user
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: geoserver_db_user
    - secretKey: gs_password
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: geoserver_db_password
    - secretKey: PG_ADMIN_USER
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: PG_ADMIN_USER
    - secretKey: PG_ADMIN_PASSWORD
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: PG_ADMIN_PASSWORD
      
---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mapp-config-geoserver
