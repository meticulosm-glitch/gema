  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mapp-config-geoserver
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: {{ $.Values.eso.path }}
