apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gema.configDbSecret" . }}
  namespace: {{ .Release.Namespace }}
  annotations: 
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gema.configDbSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: gema_db_user
    - secretKey: password
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: gema_db_password
    - secretKey: gs_user
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: geoserver_db_user
    - secretKey: gs_password
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: geoserver_db_password
    - secretKey: PG_ADMIN_USER
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: PG_ADMIN_USER
    - secretKey: PG_ADMIN_PASSWORD
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: PG_ADMIN_PASSWORD
      
---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gema.configGeoserverSecret" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ include "gema.configGeoserverSecret" . }}
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: GEOSERVER_USER       # amministratore di GeoServer: solo per il Job, l'app usa un utente di sola lettura
    - secretKey: password
      remoteRef:
        key: {{ $.Values.eso.path }}
        property: GEOSERVER_PASSWORD