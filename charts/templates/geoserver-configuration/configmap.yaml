# ConfigMap con lo script SQL e i due script di inizializzazione di mapp-web.
# Il contenuto è la fonte unica: lo legge il Job <rilascio>-config-init (job.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gema.configInitName" . }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-init
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # prima del Job
data:
  mapp-config.sql: |
    -- Tabelle di configurazione di mapp-web (ruoli -> permessi, dashboard, viste salvate, catalogo prodotti, vista iniziale
    -- per ruolo, moduli di modifica, avvisi). Idempotente: si può rieseguire.
    -- Variabili psql (le passa init-db.sh):
    --   schema   schema che contiene le tabelle (default gema_config)
    --   gs_user  utente PostgreSQL del datastore GeoServer (la password arriva dall'ambiente, GS_DB_PASSWORD)
    --   log_days giorni di registro modifiche da conservare (CHANGE_LOG_DAYS; 0 = per sempre)
    --   usage_days giorni di eventi d'uso da conservare (USAGE_DAYS; default 180; 0 = per sempre)
    \if :{?log_days}
    \else
      \set log_days 0
    \endif
    \if :{?usage_days}
    \else
      \set usage_days 180
    \endif
    CREATE SCHEMA IF NOT EXISTS :"schema";

    CREATE TABLE IF NOT EXISTS :"schema".role_rules (
      id          serial PRIMARY KEY,
      role        text NOT NULL UNIQUE,
      layers      text NOT NULL DEFAULT '[]',   -- JSON: ["iride:parcels", ...] oppure ["*"] per tutti
      tools       text NOT NULL DEFAULT '[]',   -- JSON: ["info","table","edit", ...]
      updated_by  text,
      updated_at  timestamptz DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS :"schema".dashboards (
      id          serial PRIMARY KEY,
      title       text NOT NULL,
      description text NOT NULL DEFAULT '',
      roles       text NOT NULL DEFAULT '[]',   -- JSON: ruoli che vedono la dashboard
      definition  text NOT NULL DEFAULT '[]',   -- JSON: elenco dei widget
      updated_by  text,
      updated_at  timestamptz DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS :"schema".saved_views (
      id          serial PRIMARY KEY,
      owner       text NOT NULL,                -- utente Keycloak (preferred_username) proprietario della vista
      name        text NOT NULL,
      definition  text NOT NULL DEFAULT '{}',   -- JSON: layer attivi con filtro/data/stile/opacità, sfondo, inquadratura
      created_at  timestamptz DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS saved_views_owner_idx ON :"schema".saved_views (owner);

    -- Catalogo prodotti: come appaiono i layer di GeoServer nell'elenco della mappa (pagina Admin -> Catalogo prodotti).
    -- Cartelle (anche annidate) e layer condividono l'ordinamento: `position` ordina gli elementi della stessa cartella.
    -- Nessuna foreign key tra le due tabelle: un layer con una cartella che non esiste più torna al primo livello,
    -- e l'app salva tutto in un'unica transazione WFS-T. I testi facoltativi ammettono NULL: un elemento vuoto in una
    -- transazione WFS-T può arrivare al database come NULL, e l'app lo legge come stringa vuota.
    CREATE TABLE IF NOT EXISTS :"schema".catalog_folders (
      id          serial PRIMARY KEY,
      folder_key  text NOT NULL UNIQUE CHECK (folder_key <> ''),  -- identificativo stabile (non cambia se la cartella si rinomina)
      parent_key  text DEFAULT '',              -- cartella che la contiene; '' (o NULL) = primo livello
      title       text NOT NULL CHECK (btrim(title) <> ''),
      description text DEFAULT '',
      position    integer NOT NULL DEFAULT 0,
      expanded    boolean NOT NULL DEFAULT false, -- aperta quando si apre la mappa
      hidden      boolean NOT NULL DEFAULT false, -- nasconde la cartella con tutto il contenuto
      updated_by  text,
      updated_at  timestamptz DEFAULT now(),
      CONSTRAINT catalog_folders_not_self CHECK (parent_key <> folder_key)
    );

    CREATE TABLE IF NOT EXISTS :"schema".catalog_layers (
      id          serial PRIMARY KEY,
      layer       text NOT NULL UNIQUE CHECK (layer <> ''),  -- nome GeoServer, es. iride:ndvi
      folder_key  text DEFAULT '',              -- '' (o NULL) = primo livello
      position    integer NOT NULL DEFAULT 0,
      title       text DEFAULT '',              -- '' (o NULL) = titolo di GeoServer
      description text DEFAULT '',              -- '' (o NULL) = descrizione (Abstract) di GeoServer
      hidden      boolean NOT NULL DEFAULT false, -- fuori dall'elenco (non è un permesso: quelli li danno i ruoli e GeoServer)
      default_on  boolean NOT NULL DEFAULT false, -- acceso quando la mappa si apre senza un link o una vista
      updated_by  text,
      updated_at  timestamptz DEFAULT now(),
      CONSTRAINT catalog_layers_hidden_not_on CHECK (NOT (hidden AND default_on))
    );

    -- Vista iniziale per ruolo (pagina Admin -> Ruoli e permessi): area, sfondo e layer accesi quando la mappa si apre
    -- senza un link o una vista salvata. Campi vuoti (o NULL) = impostazioni globali (MAP_BBOX, primo sfondo, catalogo).
    CREATE TABLE IF NOT EXISTS :"schema".role_views (
      id          serial PRIMARY KEY,
      role        text NOT NULL UNIQUE CHECK (role <> ''),
      bbox        text DEFAULT '',              -- "ovest,sud,est,nord" in gradi
      basemap     text DEFAULT '',              -- id dello sfondo
      layers      text DEFAULT '[]',            -- JSON: ["iride:ndvi", ...]
      updated_by  text,
      updated_at  timestamptz DEFAULT now(),
      CONSTRAINT role_views_bbox_format CHECK (bbox IS NULL OR bbox = '' OR bbox ~ '^-?[0-9]+(\.[0-9]+)?(,-?[0-9]+(\.[0-9]+)?){3}$')
    );

    -- Moduli di modifica (pagina Admin -> Moduli di modifica): per ogni layer, come appaiono i campi nell'editor
    -- (etichette, ordine, obbligatori, sola lettura, nascosti, menu a tendina, valori predefiniti). Regole dell'interfaccia:
    -- i vincoli veri dei dati restano quelli delle tabelle dei layer.
    CREATE TABLE IF NOT EXISTS :"schema".edit_forms (
      id          serial PRIMARY KEY,
      layer       text NOT NULL UNIQUE CHECK (layer <> ''),  -- nome GeoServer, es. iride:parcels
      definition  text NOT NULL DEFAULT '[]',   -- JSON: [{"name":"kind","alias":"Tipo","required":true,"options":[...]}, ...]
      updated_by  text,
      updated_at  timestamptz DEFAULT now()
    );

    -- Avvisi in testa all'applicazione (pagina Admin -> Avvisi): informazioni, attenzione, manutenzione; per periodo e ruoli.
    CREATE TABLE IF NOT EXISTS :"schema".announcements (
      id          serial PRIMARY KEY,
      message     text NOT NULL CHECK (btrim(message) <> '' AND length(message) <= 1000),
      level       text NOT NULL DEFAULT 'info' CHECK (level IN ('info', 'warning', 'maintenance')),
      starts_at   text DEFAULT '',              -- ISO 8601 con fuso; '' = subito
      ends_at     text DEFAULT '',              -- ISO 8601 con fuso; '' = finché è attivo
      roles       text DEFAULT '[]',            -- JSON: ruoli che lo vedono; [] = tutti
      dismissible boolean NOT NULL DEFAULT true,
      active      boolean NOT NULL DEFAULT true,
      updated_by  text,
      updated_at  timestamptz DEFAULT now(),
      CONSTRAINT announcements_dates CHECK (
        (starts_at IS NULL OR starts_at = '' OR starts_at ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}') AND
        (ends_at IS NULL OR ends_at = '' OR ends_at ~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}')),
      CONSTRAINT announcements_maintenance_stays CHECK (NOT (level = 'maintenance' AND dismissible))
    );

    -- Bozze delle dashboard (pagina Admin -> Crea dashboard): le modifiche restano qui finché l'amministratore non le
    -- pubblica; chi usa le dashboard legge solo la tabella dashboards. La leggono e la scrivono solo gli amministratori.
    -- Una bozza per dashboard pubblicata (dashboard_id = id in dashboards); '' (o NULL) = dashboard mai pubblicata.
    CREATE TABLE IF NOT EXISTS :"schema".dashboard_drafts (
      id           serial PRIMARY KEY,
      dashboard_id text DEFAULT '',
      title        text NOT NULL CHECK (btrim(title) <> ''),
      description  text DEFAULT '',
      roles        text DEFAULT '[]',          -- JSON: ruoli che la vedranno una volta pubblicata
      definition   text DEFAULT '[]',          -- JSON: come dashboards.definition (la bozza può essere incompleta)
      updated_by   text,
      updated_at   timestamptz DEFAULT now()
    );
    CREATE UNIQUE INDEX IF NOT EXISTS dashboard_drafts_dashboard_uq ON :"schema".dashboard_drafts (dashboard_id)
      WHERE dashboard_id IS NOT NULL AND dashboard_id <> '';

    -- Registro delle modifiche (pagina Admin -> Registro modifiche): un trigger su ogni tabella di configurazione scrive
    -- qui la riga prima e dopo ogni inserimento, modifica ed eliminazione. Chi ha fatto la modifica è la colonna
    -- updated_by della riga (l'app la imposta anche prima di eliminare). Le modifiche che toccano solo updated_by /
    -- updated_at non si registrano. L'utente applicativo può solo leggere il registro: lo scrive la funzione del trigger.
    CREATE TABLE IF NOT EXISTS :"schema".change_log (
      id          bigserial PRIMARY KEY,
      table_name  text NOT NULL,
      row_id      integer,
      op          text NOT NULL CHECK (op IN ('INSERT', 'UPDATE', 'DELETE')),
      old_data    text,                         -- JSON della riga prima (NULL per INSERT)
      new_data    text,                         -- JSON della riga dopo (NULL per DELETE)
      changed_by  text,                         -- utente dell'app (updated_by)
      db_user     text DEFAULT current_user,    -- utente PostgreSQL (di solito quello di GeoServer)
      changed_at  timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS change_log_row_idx ON :"schema".change_log (table_name, row_id, changed_at DESC);
    CREATE INDEX IF NOT EXISTS change_log_time_idx ON :"schema".change_log (changed_at DESC);

    CREATE OR REPLACE FUNCTION :"schema".gema_log_change() RETURNS trigger
      LANGUAGE plpgsql SECURITY DEFINER SET search_path = pg_catalog, pg_temp AS $fn$
    DECLARE
      o jsonb;
      n jsonb;
    BEGIN
      IF TG_OP <> 'INSERT' THEN o := to_jsonb(OLD); END IF;
      IF TG_OP <> 'DELETE' THEN n := to_jsonb(NEW); END IF;
      IF TG_OP = 'UPDATE' AND (o - 'updated_by' - 'updated_at') = (n - 'updated_by' - 'updated_at') THEN RETURN NEW; END IF;
      EXECUTE format('INSERT INTO %I.change_log (table_name, row_id, op, old_data, new_data, changed_by, db_user) VALUES ($1, $2, $3, $4, $5, $6, $7)', TG_TABLE_SCHEMA)
        USING TG_TABLE_NAME, COALESCE((n ->> 'id')::integer, (o ->> 'id')::integer), TG_OP, o::text, n::text,
              COALESCE(n ->> 'updated_by', o ->> 'updated_by'), session_user::text;
      RETURN COALESCE(NEW, OLD);
    END
    $fn$;

    -- trigger sulle tabelle di configurazione (non sulle viste salvate, che sono personali, né sulle bozze)
    SELECT format('DROP TRIGGER IF EXISTS gema_log ON %I.%I; CREATE TRIGGER gema_log AFTER INSERT OR UPDATE OR DELETE ON %I.%I FOR EACH ROW EXECUTE FUNCTION %I.gema_log_change()', :'schema', t, :'schema', t, :'schema')
      FROM unnest(ARRAY['role_rules', 'dashboards', 'catalog_folders', 'catalog_layers', 'role_views', 'edit_forms', 'announcements']) AS t \gexec

    -- conservazione (variabile log_days, da CHANGE_LOG_DAYS): 0 = per sempre
    SELECT (:'log_days' ~ '^[1-9][0-9]{0,5}$') AS prune_log \gset
    \if :prune_log
    DELETE FROM :"schema".change_log WHERE changed_at < now() - make_interval(days => :log_days);
    \endif

    -- Statistiche d'uso (pagina Admin -> Statistiche d'uso): il browser di ogni utente aggiunge eventi (pagina aperta,
    -- layer acceso, strumento, dashboard, scarico, ricerca). Gli utenti applicativi li possono solo aggiungere; li leggono
    -- gli amministratori, già aggregati per giorno nelle viste qui sotto. username vuoto = modalità anonima (USAGE_STATS).
    CREATE TABLE IF NOT EXISTS :"schema".usage_events (
      id          bigserial PRIMARY KEY,
      at          timestamptz NOT NULL DEFAULT now(),
      session     text NOT NULL CHECK (length(session) BETWEEN 8 AND 64),
      username    text DEFAULT '',
      roles       text DEFAULT '[]' CHECK (roles IS NULL OR (length(roles) <= 2000 AND jsonb_typeof(roles::jsonb) = 'array')),  -- JSON: ruoli dell'utente
      kind        text NOT NULL CHECK (kind IN ('page', 'layer', 'tool', 'dashboard', 'download', 'search', 'view')),
      target      text DEFAULT '' CHECK (length(target) <= 200),
      detail      text DEFAULT '' CHECK (length(detail) <= 200)
    );
    CREATE INDEX IF NOT EXISTS usage_events_at_idx ON :"schema".usage_events (at);

    -- per giorno e oggetto: quante volte e da quante sessioni / utenti
    CREATE OR REPLACE VIEW :"schema".usage_daily AS
      SELECT (at AT TIME ZONE 'UTC')::date AS day, kind, coalesce(target, '') AS target,
             count(*)::integer AS events, count(DISTINCT session)::integer AS sessions,
             count(DISTINCT nullif(username, ''))::integer AS users
      FROM :"schema".usage_events GROUP BY 1, 2, 3;
    -- per giorno: sessioni, utenti ed eventi in totale
    CREATE OR REPLACE VIEW :"schema".usage_sessions AS
      SELECT (at AT TIME ZONE 'UTC')::date AS day, count(*)::integer AS events, count(DISTINCT session)::integer AS sessions,
             count(DISTINCT nullif(username, ''))::integer AS users
      FROM :"schema".usage_events GROUP BY 1;
    -- per giorno e ruolo (un utente con più ruoli conta in ciascuno)
    CREATE OR REPLACE VIEW :"schema".usage_roles AS
      SELECT (e.at AT TIME ZONE 'UTC')::date AS day, r.role, count(*)::integer AS events, count(DISTINCT e.session)::integer AS sessions
      FROM :"schema".usage_events e
      CROSS JOIN LATERAL jsonb_array_elements_text(coalesce(nullif(e.roles, ''), '[]')::jsonb) AS r(role)
      GROUP BY 1, 2;

    -- per giorno e utente (solo con USAGE_STATS=named: in modalità anonima è vuota)
    CREATE OR REPLACE VIEW :"schema".usage_users AS
      SELECT (at AT TIME ZONE 'UTC')::date AS day, username, count(*)::integer AS events, count(DISTINCT session)::integer AS sessions
      FROM :"schema".usage_events WHERE coalesce(username, '') <> '' GROUP BY 1, 2;

    SELECT (:'usage_days' ~ '^[1-9][0-9]{0,5}$') AS prune_usage \gset
    \if :prune_usage
    DELETE FROM :"schema".usage_events WHERE at < now() - make_interval(days => :usage_days);
    \endif

    -- Utente applicativo = quello che GeoServer usa per il datastore. Se è diverso da chi esegue lo script (l'admin):
    --   * viene creato se manca (solo LOGIN, nessun altro privilegio) e la sua password è allineata a GS_DB_PASSWORD;
    --   * riceve solo i diritti sul database, sullo schema e sulle sue tabelle (anche su quelle create in futuro).
    SELECT (:'gs_user' <> '' AND :'gs_user' <> current_user) AS grant_gs \gset
    \if :grant_gs
    \set gs_password ''
    \getenv gs_password GS_DB_PASSWORD
    SELECT format('CREATE ROLE %I LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L', :'gs_user', :'gs_password')
      WHERE :'gs_password' <> '' AND NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'gs_user') \gexec
    SELECT format('ALTER ROLE %I PASSWORD %L', :'gs_user', :'gs_password')
      WHERE :'gs_password' <> '' AND EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'gs_user') \gexec
    SELECT format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), :'gs_user') \gexec
    GRANT USAGE ON SCHEMA :"schema" TO :"gs_user";
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA :"schema" TO :"gs_user";
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA :"schema" TO :"gs_user";
    ALTER DEFAULT PRIVILEGES IN SCHEMA :"schema" GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"gs_user";
    ALTER DEFAULT PRIVILEGES IN SCHEMA :"schema" GRANT USAGE, SELECT ON SEQUENCES TO :"gs_user";
    -- il registro si legge soltanto: lo scrive il trigger (SECURITY DEFINER)
    REVOKE INSERT, UPDATE, DELETE, TRUNCATE ON :"schema".change_log FROM :"gs_user";
    -- gli eventi d'uso si aggiungono soltanto (né modifiche né cancellazioni via GeoServer)
    REVOKE UPDATE, DELETE, TRUNCATE ON :"schema".usage_events FROM :"gs_user";
    \endif

  init-db.sh: |
    #!/bin/sh
    # Passo 1: crea (se serve) database, tabelle e utente applicativo. Idempotente.
    # Usa DUE utenze diverse:
    #   PG_ADMIN_USER / PG_ADMIN_PASSWORD   amministratore: CREATE DATABASE, schema, tabelle, ruolo applicativo
    #   GS_DB_USER / GS_DB_PASSWORD         utente applicativo (quello del datastore GeoServer): creato qui se manca,
    #                                       con i soli diritti sulle tabelle di configurazione
    set -eu

    : "${PGHOST:?PGHOST mancante}" "${PG_ADMIN_USER:?PG_ADMIN_USER mancante}" "${PG_ADMIN_PASSWORD:?PG_ADMIN_PASSWORD mancante}"
    export PGCONNECT_TIMEOUT="${PGCONNECT_TIMEOUT:-5}"
    psql_admin() { PGPASSWORD="$PG_ADMIN_PASSWORD" psql -U "$PG_ADMIN_USER" "$@"; }
    DB="${MAPP_DB:-gema_config}"
    SCHEMA="${MAPP_SCHEMA:-gema_config}"
    GS_USER="${GS_DB_USER:-}"

    # i nomi finiscono in SQL come identificatori: solo caratteri semplici
    for v in "$DB" "$SCHEMA" "$GS_USER"; do
      case "$v" in
        "") ;;
        [0-9]*|*[!A-Za-z0-9_]*) echo "[init-db] nome non valido: '$v' (ammessi lettere, cifre e _)" >&2; exit 2 ;;
      esac
    done
    [ "$GS_USER" != "$PG_ADMIN_USER" ] || echo "[init-db] ATTENZIONE: utente applicativo e amministratore coincidono: GeoServer userebbe l'utenza di amministrazione"

    echo "[init-db] attendo PostgreSQL su ${PGHOST}:${PGPORT:-5432} ..."
    i=0
    until psql_admin -d postgres -Atqc "SELECT 1" >/dev/null 2>&1 || psql_admin -d "$DB" -Atqc "SELECT 1" >/dev/null 2>&1; do
      i=$((i + 1))
      [ "$i" -le "${WAIT_TRIES:-60}" ] || { echo "[init-db] PostgreSQL non raggiungibile (utente $PG_ADMIN_USER)" >&2; psql_admin -d postgres -Atqc "SELECT 1" >&2 || true; exit 1; }
      sleep 5
    done

    if [ "${DB_CREATE:-false}" = "true" ]; then
      if [ "$(psql_admin -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname = '$DB'")" = "1" ]; then
        echo "[init-db] database $DB già presente"
      else
        echo "[init-db] creo il database $DB"
        psql_admin -d postgres -v ON_ERROR_STOP=1 -qc "CREATE DATABASE \"$DB\""
      fi
    fi

    # l'utente applicativo deve esistere o poter essere creato (serve la password)
    if [ -n "$GS_USER" ] && [ "$GS_USER" != "$PG_ADMIN_USER" ] && [ -z "${GS_DB_PASSWORD:-}" ]; then
      if [ "$(psql_admin -d postgres -Atqc "SELECT 1 FROM pg_roles WHERE rolname = '$GS_USER'")" != "1" ]; then
        echo "[init-db] l'utente $GS_USER non esiste e GS_DB_PASSWORD è vuota: non posso crearlo" >&2
        exit 2
      fi
      echo "[init-db] utente $GS_USER già presente, password non toccata (GS_DB_PASSWORD vuota)"
    fi

    # PostGIS: il datastore di GeoServer lo vuole nel database (best effort: serve un utente che possa creare estensioni)
    if [ "${POSTGIS_EXTENSION:-true}" = "true" ]; then
      psql_admin -d "$DB" -qc "CREATE EXTENSION IF NOT EXISTS postgis" >/dev/null 2>&1 \
        && echo "[init-db] estensione postgis presente" \
        || echo "[init-db] postgis non creata (permessi o estensione assente): se serve, abilitala con un superuser"
    fi

    echo "[init-db] applico lo schema $SCHEMA su $DB (utente applicativo: ${GS_USER:-nessuno})"
    psql_admin -d "$DB" -v ON_ERROR_STOP=1 -v schema="$SCHEMA" -v gs_user="$GS_USER" -v log_days="${CHANGE_LOG_DAYS:-0}" -v usage_days="${USAGE_DAYS:-180}" -f /scripts/mapp-config.sql
    echo "[init-db] fatto"

  publish-geoserver.sh: |
    #!/bin/sh
    # Passo 2: pubblica in GeoServer workspace, datastore e i layer di configurazione (role_rules, dashboards, saved_views,
    # catalog_folders, catalog_layers, role_views, edit_forms, announcements, dashboard_drafts, change_log, usage_events e le viste usage_daily, usage_sessions, usage_roles, usage_users) via REST.
    # Idempotente: ciò che esiste già non viene toccato. Disattivabile con PUBLISH_GEOSERVER=false.
    set -eu

    [ "${PUBLISH_GEOSERVER:-true}" = "true" ] || { echo "[geoserver] pubblicazione disattivata (PUBLISH_GEOSERVER=false)"; exit 0; }

    GS="${GEOSERVER_URL:?GEOSERVER_URL mancante (es. http://geoserver:8080/geoserver)}"
    GS="${GS%/}"
    : "${GEOSERVER_USER:?GEOSERVER_USER mancante}" "${GEOSERVER_PASSWORD:?GEOSERVER_PASSWORD mancante}"
    WS="${CONFIG_WORKSPACE:-gema}"
    DS="${DATASTORE:-gema_config}"
    DB="${MAPP_DB:-gema_config}"
    SCHEMA="${MAPP_SCHEMA:-gema_config}"
    DBHOST="${DS_DB_HOST:-${PGHOST:?PGHOST mancante}}"
    DBPORT="${DS_DB_PORT:-${PGPORT:-5432}}"
    # il datastore usa SEMPRE l'utente applicativo (mai l'amministratore del database)
    DBUSER="${GS_DB_USER:-${PGUSER:?GS_DB_USER o PGUSER mancante}}"
    DBPASS="${GS_DB_PASSWORD:-${PGPASSWORD:?GS_DB_PASSWORD o PGPASSWORD mancante}}"
    TABLES="role_rules dashboards saved_views catalog_folders catalog_layers role_views edit_forms announcements dashboard_drafts change_log usage_events usage_daily usage_sessions usage_roles usage_users"
    UPDATE_DS="${UPDATE_DATASTORE:-false}"
    TMP="${TMPDIR:-/tmp}"

    for v in "$WS" "$DS" "$DB" "$SCHEMA"; do
      case "$v" in
        ""|*[!A-Za-z0-9_-]*) echo "[geoserver] nome non valido: '$v'" >&2; exit 2 ;;
      esac
    done

    # escape per i valori messi tra virgolette in JSON / file di configurazione di curl
    jesc() { printf '%s' "$1" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g'; }

    # credenziali in un file (non nella riga di comando)
    umask 077
    printf 'user = "%s:%s"\n' "$(jesc "$GEOSERVER_USER")" "$(jesc "$GEOSERVER_PASSWORD")" > "$TMP/gs.curlrc"

    # api METODO PERCORSO [JSON]  ->  stampa lo status HTTP, corpo in $TMP/body
    api() {
      m=$1; p=$2; d=${3:-}
      if [ -n "$d" ]; then
        curl -sS -K "$TMP/gs.curlrc" -o "$TMP/body" -w '%{http_code}' --max-time 30 -X "$m" -H 'Content-Type: application/json' -H 'Accept: application/json' -d "$d" "$GS$p" || true
      else
        curl -sS -K "$TMP/gs.curlrc" -o "$TMP/body" -w '%{http_code}' --max-time 30 -X "$m" -H 'Accept: application/json' "$GS$p" || true
      fi
    }
    die() { echo "[geoserver] $1" >&2; if [ -s "$TMP/body" ]; then echo "[geoserver] risposta di GeoServer:" >&2; head -c 2500 "$TMP/body" >&2; echo >&2; fi; exit 1; }
    # valore di un parametro di connessione dal JSON del datastore (corpo in $TMP/body)
    dsparam() { tr '{}' '\n\n' < "$TMP/body" | grep "\"@key\":\"$1\"" | head -n 1 | sed 's/.*"\$":"\([^"]*\)".*/\1/'; }
    # JSON del datastore con i parametri voluti
    ds_body() {
      printf '{"dataStore":{"name":"%s","type":"PostGIS","enabled":true,"connectionParameters":{"entry":[{"@key":"dbtype","$":"postgis"},{"@key":"host","$":"%s"},{"@key":"port","$":"%s"},{"@key":"database","$":"%s"},{"@key":"schema","$":"%s"},{"@key":"user","$":"%s"},{"@key":"passwd","$":"%s"},{"@key":"Expose primary keys","$":"false"},{"@key":"validate connections","$":"true"}]}}}' \
        "$DS" "$(jesc "$DBHOST")" "$DBPORT" "$(jesc "$DB")" "$SCHEMA" "$(jesc "$DBUSER")" "$(jesc "$DBPASS")"
    }

    echo "[geoserver] attendo $GS ..."
    i=0
    while :; do
      s=$(api GET /rest/about/version.json)
      [ "$s" = "200" ] && break
      [ "$s" = "401" ] && die "credenziali GeoServer rifiutate (HTTP 401): controlla GEOSERVER_USER/PASSWORD e che /rest accetti l'autenticazione basic"
      i=$((i + 1)); [ "$i" -le "${WAIT_TRIES:-60}" ] || die "GeoServer non risponde (ultimo status $s)"
      sleep 5
    done

    # --- workspace
    s=$(api GET "/rest/workspaces/$WS.json")
    if [ "$s" = "404" ]; then
      s=$(api POST /rest/workspaces "{\"workspace\":{\"name\":\"$WS\"}}")
      [ "$s" = "201" ] || die "creazione workspace $WS fallita (HTTP $s)"
      echo "[geoserver] workspace $WS creato"
    elif [ "$s" = "200" ]; then echo "[geoserver] workspace $WS già presente"
    else die "lettura workspace $WS fallita (HTTP $s)"; fi

    # --- datastore PostGIS. Se esiste, i parametri si confrontano con quelli voluti (UPDATE_DATASTORE=true li allinea)
    s=$(api GET "/rest/workspaces/$WS/datastores/$DS.json")
    if [ "$s" = "404" ]; then
      s=$(api POST "/rest/workspaces/$WS/datastores" "$(ds_body)")
      [ "$s" = "201" ] || die "creazione datastore $DS fallita (HTTP $s)"
      echo "[geoserver] datastore $DS creato (db=$DB schema=$SCHEMA utente=$DBUSER)"
    elif [ "$s" = "200" ]; then
      diff=""
      for pair in "host:$DBHOST" "port:$DBPORT" "database:$DB" "schema:$SCHEMA" "user:$DBUSER"; do
        k=${pair%%:*}; want=${pair#*:}; cur=$(dsparam "$k")
        [ "$cur" = "$want" ] || diff="$diff $k(attuale='$cur' voluto='$want')"
      done
      if [ -z "$diff" ]; then
        echo "[geoserver] datastore $DS già presente e allineato (db=$DB schema=$SCHEMA utente=$DBUSER)"
      elif [ "$UPDATE_DS" = "true" ]; then
        s=$(api PUT "/rest/workspaces/$WS/datastores/$DS" "$(ds_body)")
        [ "$s" = "200" ] || die "aggiornamento del datastore $DS fallito (HTTP $s)"
        echo "[geoserver] datastore $DS aggiornato, differenze corrette:$diff"
      else
        echo "[geoserver] ATTENZIONE: il datastore $DS esiste con parametri diversi da quelli del Job:$diff" >&2
        echo "[geoserver]   per allinearlo imposta UPDATE_DATASTORE=true (la password non è confrontabile e viene riscritta)" >&2
      fi
    else die "lettura datastore $DS fallita (HTTP $s)"; fi

    # --- layer (tabelle senza geometria: saranno disponibili solo in WFS)
    for t in $TABLES; do
      s=$(api GET "/rest/workspaces/$WS/datastores/$DS/featuretypes/$t.json")
      if [ "$s" = "404" ]; then
        # il datastore deve vedere la tabella: se non la vede, l'errore vero è qui (connessione, schema o permessi)
        s=$(api GET "/rest/workspaces/$WS/datastores/$DS/featuretypes.json?list=available")
        [ "$s" = "200" ] || die "il datastore $DS non riesce a leggere il database (HTTP $s): controlla utente/password, host e rete verso PostgreSQL, e il log di GeoServer"
        case "$(cat "$TMP/body")" in
          *"\"$t\""*) ;;
          *) echo "[geoserver] tabelle che il datastore $DS vede in $SCHEMA: $(cat "$TMP/body")" >&2
             die "la tabella $t non è visibile dal datastore $DS: schema sbagliato ($SCHEMA?), tabella non creata dal passo SQL o utente $DBUSER senza permessi" ;;
        esac
        s=$(api POST "/rest/workspaces/$WS/datastores/$DS/featuretypes" "{\"featureType\":{\"name\":\"$t\",\"nativeName\":\"$t\",\"title\":\"$t\",\"enabled\":true}}")
        [ "$s" = "201" ] || die "pubblicazione di $WS:$t fallita (HTTP $s)"
        echo "[geoserver] layer $WS:$t pubblicato"
      elif [ "$s" = "200" ]; then echo "[geoserver] layer $WS:$t già pubblicato"
      else die "lettura del layer $WS:$t fallita (HTTP $s)"; fi
    done

    # --- regole dati (opzionale): ruoli, dashboard e catalogo si leggono dai ruoli applicativi e si scrivono solo dall'admin;
    #     le viste salvate le scrive chiunque abbia un ruolo applicativo (ognuno salva le proprie)
    if [ "${SET_ACL:-false}" = "true" ]; then
      READ="${ACL_READ_ROLES:?ACL_READ_ROLES mancante (es. ROLE_FSS-ETL-VIEWER,ROLE_FSS-ETL-ADMIN)}"
      WRITE="${ACL_WRITE_ROLES:?ACL_WRITE_ROLES mancante (es. ROLE_FSS-ETL-ADMIN)}"
      VIEWS_WRITE="${ACL_VIEWS_WRITE_ROLES:-$READ}"
      api GET /rest/security/acl/layers >/dev/null
      cp "$TMP/body" "$TMP/acl.json"
      acl() { # $1 = layer, $2 = r|w, $3 = ruoli
        key="$WS.$1.$2"
        rule="{\"$key\":\"$(jesc "$3")\"}"
        if grep -q "\"$key\"" "$TMP/acl.json"; then s=$(api PUT /rest/security/acl/layers "$rule"); else s=$(api POST /rest/security/acl/layers "$rule"); fi
        case "$s" in 200|201) echo "[geoserver] regola $key = $3" ;; *) die "regola $key non applicata (HTTP $s)" ;; esac
      }
      for t in role_rules dashboards catalog_folders catalog_layers role_views edit_forms announcements; do acl "$t" r "$READ"; acl "$t" w "$WRITE"; done
      # le bozze delle dashboard restano agli amministratori: nemmeno la lettura ai ruoli applicativi
      acl dashboard_drafts r "$WRITE"
      acl dashboard_drafts w "$WRITE"
      # il registro modifiche lo leggono solo gli amministratori dell'app e non lo scrive nessuno (nemmeno il database lo consente)
      acl change_log r "$WRITE"
      acl change_log w "ADMIN"
      # statistiche d'uso: tutti i ruoli applicativi aggiungono eventi (il database non consente modifiche né cancellazioni).
      # GeoServer nasconde i layer non leggibili, quindi per aggiungere serve anche la lettura della tabella grezza; le viste
      # aggregate le leggono solo gli amministratori. Con USAGE_STATS=named la tabella grezza contiene i nomi utente.
      acl usage_events r "$READ"
      acl usage_events w "$READ"
      for t in usage_daily usage_sessions usage_roles usage_users; do acl "$t" r "$WRITE"; acl "$t" w "ADMIN"; done
      acl saved_views r "$READ"
      acl saved_views w "$VIEWS_WRITE"
    else
      echo "[geoserver] regole dati non toccate (SET_ACL=false): ricordati di limitare la scrittura su $WS:role_rules, $WS:dashboards, $WS:catalog_folders, $WS:catalog_layers, $WS:role_views, $WS:edit_forms e $WS:announcements al ruolo admin, lettura e scrittura su $WS:dashboard_drafts al ruolo admin (e la scrittura su $WS:saved_views ai ruoli applicativi)"
    fi

    # --- verifica finale: lo schema deve essere leggibile via WFS come lo legge l'app
    for t in $TABLES; do
      s=$(curl -sS -K "$TMP/gs.curlrc" -o "$TMP/body" -w '%{http_code}' --max-time 30 "$GS/ows?service=WFS&version=1.0.0&request=DescribeFeatureType&typeName=$WS:$t" || echo 000)
      [ "$s" = "200" ] && grep -q 'name="' "$TMP/body" && ! grep -q 'ServiceException' "$TMP/body" || die "$WS:$t non risponde in WFS (HTTP $s)"
      echo "[geoserver] verifica WFS $WS:$t ok"
    done
    rm -f "$TMP/gs.curlrc"
    echo "[geoserver] fatto"