{{- if and .Values.auth.enabled .Values.auth.createSecret }}
# Secret di oauth2-proxy (client secret OIDC e chiave dei cookie), da Vault. Separato da quello dell'app: nginx non li vede.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.auth.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.eso.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.auth.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.eso.path }}
        property: OIDC_CLIENT_SECRET
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: {{ .Values.eso.path }}
        property: OAUTH2_PROXY_COOKIE_SECRET
{{- end }}
