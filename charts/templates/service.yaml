apiVersion: v1
kind: Service
metadata:
  name: {{ include "geolibre.fullname" . }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "geolibre.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      # con oauth2-proxy il traffico passa prima dal login (porta 4180), altrimenti va direttamente a nginx
      targetPort: {{ if .Values.auth.enabled }}4180{{ else }}{{ .Values.service.targetPort }}{{ end }}
  {{- if .Values.metrics.enabled }}
    # /metrics di nginx per Prometheus: solo dentro al cluster (la rotta APISIX usa la porta http)
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  {{- end }}
