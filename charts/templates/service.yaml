apiVersion: v1
kind: Service
metadata:
  name: {{ include "geolibre.fullname" . }}
  labels:
    {{- include "geolibre.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "geolibre.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
