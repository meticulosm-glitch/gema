# log leggibile per il debug del proxy: mostra a quale upstream è andata la richiesta e con che esito
# (l'header Authorization NON viene loggato)
log_format mapp '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time cache=$upstream_cache_status';

# stesso log in JSON (ACCESS_LOG_FORMAT=json), una riga per richiesta: comodo in Loki per le statistiche d'uso
# (layer richiesti, servizi, scarichi, errori). Nessun header, nessun token, nessun cookie; della query solo i parametri OGC.
log_format mapp_json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri",'
                '"status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_status":"$upstream_status","cache":"$upstream_cache_status",'
                '"service":"$arg_service","request":"$arg_request","layers":"$arg_layers$arg_layer",'
                '"typename":"$arg_typename$arg_typenames","format":"$arg_outputformat$arg_format"}';

# header Authorization verso GeoServer, cache, limiti per client, formato dei log (generati all'avvio dagli script di entrypoint)
include /etc/nginx/proxy.d/*.map;

server {
  listen 8080;
  server_name _;

  # formato scelto all'avvio (35-proxy-config.sh scrive log.map con $mapp_log_text / $mapp_log_json)
  access_log /dev/stdout mapp if=$mapp_log_text;
  access_log /dev/stdout mapp_json if=$mapp_log_json;
  error_log  /dev/stderr warn;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # intestazioni di sicurezza e Content-Security-Policy (generate all'avvio da 45-security-config.sh). nginx non eredita gli
  # add_header del server in una location che ne aggiunge di propri: per questo security.inc va incluso anche lì.
  include /etc/nginx/proxy.d/security.inc;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # configurazione runtime: mai in cache
  location = /config.json {
    include /etc/nginx/proxy.d/security.inc;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # asset con hash nel nome: cache lunga
  location /assets/ {
    include /etc/nginx/proxy.d/security.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # worker di MapLibre (.mjs): alcune versioni di mime.types non lo conoscono e il browser rifiuta i moduli senza MIME JavaScript
  location ~ ^/assets/.+\.mjs$ {
    default_type text/javascript;
    include /etc/nginx/proxy.d/security.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # reverse proxy verso backend e GeoServer (35-proxy-config.sh), segnalazioni dal browser (45-security-config.sh)
  include /etc/nginx/proxy.d/*.conf;

  # SPA fallback
  location / {
    include /etc/nginx/proxy.d/security.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
